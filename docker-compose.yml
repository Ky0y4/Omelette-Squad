version: '3.8'

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - ENV=development

  frontend:
    build:
      context: ./career-advisor
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
