name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend—Lint, Test, Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (Ruff — zero errors required)
        working-directory: backend
        run: ruff check . --statistics

      - name: Run tests with coverage (minimum 80%)
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  frontend-checks:
    name: Frontend — Lint, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: career-advisor/package-lock.json

      - name: Install dependencies
        working-directory: career-advisor
        run: npm ci

      - name: Lint (ESLint — zero errors required)
        working-directory: career-advisor
        run: npm run lint

      - name: Build (zero build errors required)
        working-directory: career-advisor
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Unit tests
        working-directory: career-advisor
        run: npm test --if-present -- --passWithNoTests

  deployment-checks:
    name: Deployment — Regression, Performance, Security
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    services:
      backend:
        image: python:3.11-slim
        ports:
          - 8000:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend server
        working-directory: backend
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/docs || exit 1

      - name: API Performance — non-AI endpoints < 800ms
        run: |
          RESPONSE_TIME=$(curl -o /dev/null -s -w "%{time_total}" http://localhost:8000/docs)
          echo "Response time: ${RESPONSE_TIME}s"
          python3 -c "
          t = float('${RESPONSE_TIME}')
          assert t < 0.8, f'Non-AI endpoint took {t:.3f}s — exceeds 800ms threshold'
          print(f'PASS: {t:.3f}s < 0.800s')
          "

      - name: Security — check no API keys in source
        run: |
          echo "Scanning for exposed secrets..."
          if grep -rn "GEMINI_API_KEY\s*=\s*['\"][A-Za-z0-9]" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" career-advisor/; then
            echo "FAIL: API key found in frontend source"
            exit 1
          fi
          if grep -rn "ZAI_API_KEY\s*=\s*['\"][A-Za-z0-9]" --include="*.py" backend/; then
            echo "FAIL: API key hardcoded in backend source"
            exit 1
          fi
          echo "PASS: No API keys exposed in source"

      - name: Regression tests (minimum 90%)
        working-directory: backend
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest --cov=. --cov-fail-under=90 -v

      - name: Critical bug check — no P0/P1 open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CRITICAL=$(gh issue list --label "P0,P1" --state open --json number --jq length)
          echo "Open P0/P1 issues: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "FAIL: $CRITICAL critical bug(s) open — cannot deploy"
            exit 1
          fi
          echo "PASS: No critical bugs open"

  docker-build:
    name: Docker — Build and Push
    runs-on: ubuntu-latest
    needs: [deployment-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t omelette-backend ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            -t omelette-frontend ./career-advisor

      - name: Smoke test — docker compose up
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "ZAI_API_KEY=${ZAI_API_KEY}" > backend/.env
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> backend/.env
          docker compose up -d
          sleep 10
          curl -f http://localhost:8000/docs || (docker compose logs && exit 1)
          curl -f http://localhost:3000 || (docker compose logs && exit 1)
          docker compose down
